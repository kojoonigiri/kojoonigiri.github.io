<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artikel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="blog.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kojo: {
              red: '#B30006',
              gold: '#C9A227',
              navy: '#0B1F3A',
              dark: '#111827',
              gray: '#4B5563',
              light: '#FAFAFA'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    .bg-seigaiha {
      background-color: #fafafa;
      background-image: radial-gradient(#e5e7eb 0.75px, transparent 0.75px), radial-gradient(#e5e7eb 0.75px, #fafafa 0.75px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
  </style>
</head>
<body class="font-sans text-gray-800 bg-white antialiased">
  <div class="bg-gradient-to-r from-red-700 via-kojo-red to-gold text-white text-xs md:text-sm font-medium py-2.5 px-4 text-center shadow-inner">
    <div class="max-w-7xl mx-auto flex justify-center items-center gap-2 flex-wrap">
      <span class="bg-white/20 text-white px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider">Lifestyle &amp; Kuliner</span>
      <span>📞 0851-6593-5577 &middot; 📸 @kojo_onigiri</span>
    </div>
  </div>

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/articles/" class="flex items-center gap-2 text-xl font-bold text-kojo-navy">
          <i class="fas fa-hamburger text-gold text-lg"></i>
          <span>Kojo Onigiri</span>
        </a>
        <nav class="flex items-center gap-4 text-sm font-medium">
          <a href="/articles/" class="hover:text-kojo-red transition">← Kembali</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-8">
      <article id="article-content">
        <p class="text-center text-gray-500">Memuat artikel...</p>
      </article>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (!slug) {
      document.getElementById('article-content').innerHTML =
        '<div class="text-center py-8 text-red-500"><p>Tidak ada artikel yang dipilih.</p></div>';
      throw new Error('Missing slug');
    }

    // Escape HTML helper
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Process inline markdown: bold and italic
    function processInline(text) {
      let html = escapeHtml(text);
      // Bold: **text**
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      // Italic: *text*
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      return html;
    }

    // Full markdown to HTML (Vanilla JS)
    function markdownToHtml(markdown) {
      const lines = markdown.split('\n');
      let html = '';
      let inList = false;
      let inQuote = false;
      let paragraph = '';

      function flushParagraph() {
        if (paragraph) {
          html += `<p>${processInline(paragraph)}</p>`;
          paragraph = '';
        }
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Headers
        if (line.startsWith('# ')) {
          flushParagraph();
          html += `<h1>${processInline(line.substring(2))}</h1>`;
        } else if (line.startsWith('## ')) {
          flushParagraph();
          html += `<h2>${processInline(line.substring(3))}</h2>`;
        } else if (line.startsWith('### ')) {
          flushParagraph();
          html += `<h3>${processInline(line.substring(4))}</h3>`;
        }
        // Lists
        else if (line.startsWith('- ')) {
          flushParagraph();
          if (!inList) {
            html += '<ul>';
            inList = true;
          }
          html += `<li>${processInline(line.substring(2))}</li>`;
        }
        // Blockquotes
        else if (line.startsWith('> ')) {
          flushParagraph();
          if (!inQuote) {
            html += '<blockquote>';
            inQuote = true;
          }
          html += `<p>${processInline(line.substring(2))}</p>`;
        }
        // Images
        else if (line.startsWith('![')) {
          const imgMatch = line.match(/^!\[([^\]]*)\]\(([^)]+)\)/);
          if (imgMatch) {
            flushParagraph();
            const alt = imgMatch[1];
            const src = imgMatch[2];
            html += `<div class="my-4 text-center"><img src="${src}" alt="${alt}" class="max-w-full h-auto rounded-lg shadow-sm border border-gray-200"></div>`;
          }
        }
        // Blank line (end of paragraph)
        else if (line.trim() === '') {
          flushParagraph();
          if (inList) { html += '</ul>'; inList = false; }
          if (inQuote) { html += '</blockquote>'; inQuote = false; }
        }
        // Regular content
        else {
          paragraph += (paragraph ? ' ' : '') + line;
        }
      }

      // Close any remaining blocks
      flushParagraph();
      if (inList) html += '</ul>';
      if (inQuote) html += '</blockquote>';

      return html;
    }

    // Fetch and render article
    fetch('articles.json')
      .then(res => {
        if (!res.ok) throw new Error('Gagal memuat daftar artikel.');
        return res.json();
      })
      .then(data => {
        const article = data.articles.find(a => a.slug === slug);
        if (!article) throw new Error('Artikel tidak ditemukan.');
        return { ...article, body: '' };
      })
      .then(article => {
        return fetch(`${slug}.md`).then(res => {
          if (!res.ok) throw new Error('Gagal memuat konten artikel.');
          return res.text();
        }).then(body => ({ ...article, body }));
      })
      .then(data => {
        // Parse frontmatter
        const [frontmatter, ...contentLines] = data.body.split('---');
        const meta = {};
        (frontmatter || '').split('\n').forEach(line => {
          const colonIndex = line.indexOf(':');
          if (colonIndex !== -1) {
            const key = line.substring(0, colonIndex).trim();
            let value = line.substring(colonIndex + 1).trim();
            // Remove surrounding quotes
            if (value.startsWith('"') && value.endsWith('"')) {
              value = value.substring(1, value.length - 1);
            }
            if (key) meta[key] = value;
          }
        });

        // Render the content
        const contentHtml = markdownToHtml(contentLines.join('---'));

        document.title = meta.title || data.title;
        document.getElementById('article-content').innerHTML = `
          <h1 class="text-2xl font-bold text-kojo-navy mb-4">${escapeHtml(meta.title || data.title)}</h1>
          <p class="text-gray-600 mb-6">${escapeHtml(meta.date || data.date)} &middot; ${escapeHtml(meta.category || data.category)}</p>
          <div class="prose-kojo prose-sm max-w-none">${contentHtml}</div>
        `;
      })
      .catch(err => {
        document.getElementById('article-content').innerHTML =
          `<div class="text-center py-8 text-red-500"><p>Gagal memuat artikel: ${escapeHtml(err.message)}</p></div>`;
      });
  </script>
</body>
</html>
