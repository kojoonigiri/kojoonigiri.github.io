<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artikel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kojo: {
              red: '#B30006',
              gold: '#C9A227',
              navy: '#0B1F3A',
              dark: '#111827',
              gray: '#4B5563',
              light: '#FAFAFA'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    .bg-seigaiha {
      background-color: #fafafa;
      background-image: radial-gradient(#e5e7eb 0.75px, transparent 0.75px), radial-gradient(#e5e7eb 0.75px, #fafafa 0.75px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
  </style>
</head>
<body class="font-sans text-gray-800 bg-white antialiased">
  <div class="bg-gradient-to-r from-red-700 via-kojo-red to-gold text-white text-xs md:text-sm font-medium py-2.5 px-4 text-center shadow-inner">
    <div class="max-w-7xl mx-auto flex justify-center items-center gap-2 flex-wrap">
      <span class="bg-white/20 text-white px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider">Lifestyle &amp; Kuliner</span>
      <span>📞 0851-6593-5577 &middot; 📸 @kojo_onigiri</span>
    </div>
  </div>

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/articles/" class="flex items-center gap-2 text-xl font-bold text-kojo-navy">
          <i class="fas fa-hamburger text-gold text-lg"></i>
          <span>Kojo Onigiri</span>
        </a>
        <nav class="flex items-center gap-4 text-sm font-medium">
          <a href="/articles/" class="hover:text-kojo-red transition">← Kembali</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-8">
      <article id="article-content">
        <p class="text-center text-gray-500">Memuat artikel...</p>
      </article>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (!slug) {
      document.getElementById('article-content').innerHTML =
        '<div class="text-center py-8 text-red-500"><p>Tidak ada artikel yang dipilih.</p></div>';
      throw new Error('Missing slug');
    }

    fetch('articles.json')
      .then(res => res.json())
      .then(data => {
        const article = data.articles.find(a => a.slug === slug);
        if (!article) throw new Error('Article not found');
        return { ...article, body: '' };
      })
      .then(article => {
        return fetch(`${slug}.md`).then(res => res.text()).then(body => ({ ...article, body }));
      })
      .then(data => {
        const [frontmatter, ...content] = data.body.split('---');
        const meta = {};
        (frontmatter || '').split('\n').forEach(line => {
          const [key, ...val] = line.split(':');
          if (key && val.length) meta[key.trim()] = val.join(':').trim();
        });
        document.title = meta.title || data.title;
        document.getElementById('article-content').innerHTML = `
          <h1 class="text-2xl font-bold text-kojo-navy mb-4">${meta.title || data.title}</h1>
          <p class="text-gray-600 mb-6">${meta.date || data.date} &middot; ${meta.category || data.category}</p>
          <div class="prose prose-kojo prose-sm max-w-none">${content.join('---')}</div>
        `;
      })
      .catch(err => {
        document.getElementById('article-content').innerHTML =
          `<div class="text-center py-8 text-red-500"><p>Gagal memuat artikel: ${err.message}</p></div>`;
      });
  </script>
</body>
</html>
