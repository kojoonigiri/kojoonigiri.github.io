# Place your Decap CMS configuration here.
# See https://decapcms.org/docs/configuration-options/ for all options.

backend:
  name: github
  repo: kojoonigiri/kojoonigiri.github.io
  branch: main
  base_url: https://api.github.com
  auth_type: implicit # GitHub OAuth (implicit flow)

# Folder where user-uploaded media (images) will be stored.
media_folder: "/blog/assets/images"
# Public URL that serves the uploaded media.
public_folder: "/blog/assets/images"

collections:
  - name: "articles"
    label: "Artikel Blog"
    folder: "blog/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Artikel", name: "title", widget: "string", required: true }
      - { label: "Tanggal Publikasi", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - {
          label: "Kategori",
          name: "category",
          widget: "string",
          default: "Kuliner & Bisnis",
        }
      - {
          label: "Isi Artikel",
          name: "body",
          widget: "markdown",
        }
