backend:
  name: github
  branch: main
  repo: kojoonigiri/web
  base_url: https://kojoonigiri.github.io/web

media_folder: "images"
public_folder: "/images"

publish_mode: editorial

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
      - file: "About.html"
        label: "About"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
      - file: "Contact.html"
        label: "Contact"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
